[package]
name = "whichdisk"
version = "0.7.0"
edition = "2024"
repository = "https://github.com/al8n/whichdisk"
homepage = "https://github.com/al8n/whichdisk"
documentation = "https://docs.rs/whichdisk"
description = "Cross-platform disk/volume resolver — given a path, tells you which disk it's on, its mount point, relative path, disk usage, per-volume capabilities (case-sensitivity, filesystem type), a durable volume identity (filesystem UUID or serial), and the volume's name"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
categories = ["filesystem", "os", "development-tools"]
keywords = ["disk", "volume", "mount", "path", "mountinfo"]

[features]
default = ["disk-usage", "list"]
disk-usage = []
list = []
cli = ["disk-usage", "list", "clap", "serde", "serde_json", "yaml-rust2"]

[[bin]]
name = "whichdisk"
required-features = ["cli"]

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }
memchr = { version = "2", default-features = false }

# `poll` proves a read of the Linux mount table was not overlapped by a change.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["event"] }

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "watchos", target_os = "tvos", target_os = "visionos", target_os = "netbsd"))'.dependencies]
libc = "0.2"

# libc is only needed for `list` (getfsstat) on FreeBSD/OpenBSD/DragonFlyBSD.
# On NetBSD and Apple platforms it is always required (statvfs, getattrlist).
[target.'cfg(any(target_os = "freebsd", target_os = "openbsd", target_os = "dragonfly"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Wdk_Storage_FileSystem",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Properties",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
] }

[dependencies]
bytes = "1"
clap = { version = "4", features = ["derive", "color"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
yaml-rust2 = { version = "0.12", optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

# The laws hold the btrfs questions — their opcodes, the structure one is
# answered into and the filesystem magic — to the kernel's own, which this
# crate spells itself.
[target.'cfg(target_os = "linux")'.dev-dependencies]
linux-raw-sys = { version = "0.12", features = ["btrfs", "ioctl"] }

# The laws hold this crate's integer-only mirrors of the `FILE_FS_*`
# structures against the binding crate's own, which live behind the first
# feature, and `REG_DWORD` against its own behind `Win32_System_Registry`; the
# other two let a law open the volume device under a restricted token, as an
# unprivileged process would.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
  "Wdk_System_SystemServices",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_System_Threading",
] }

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(all_tests)',
  'cfg(tarpaulin)',
] }
